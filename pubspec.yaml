name: spendly_app
description: "Spendly — Personal Finance App"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Routing
  go_router: ^14.2.0

  # Dependency Injection
  get_it: ^7.7.0

  # Functional error handling (Either/Failure)
  dartz: ^0.10.1

  # Fonts (Inter + IBM Plex Mono per design tokens, no local font assets needed)
  google_fonts: ^6.2.1

  # Formatting (currency, date)
  intl: ^0.19.0

  # Environment config (Supabase URL/anon key) — loaded from .env, never
  # hardcoded or committed as real secrets.
  flutter_dotenv: ^5.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
